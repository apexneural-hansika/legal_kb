<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <title>Malaysian Legal Explorer</title>
</head>
<body>
    <div class="sidebar">
        <div class="wow-header">Legal Explorer</div>
        <div style="padding: 20px; font-size: 14px; color: #94a3b8;">
            <b>Active Context:</b><br>
            Rules of Court 2012 (Malaysia)
        </div>
    </div>
    <div class="chat-area">
        <div class="messages" id="chat">
            <div class="message ai-message">
                Selamat Datang. I am your Malaysian Legal Assistant. How can I assist you with the Rules of Court 2012 today?
            </div>
        </div>
        <div class="input-area">
            <input type="text" placeholder="Ask about an Order or Rule...">
            <button style="background: #d4af37; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold;">Send</button>
        </div>
    </div>
</body>
</html>
